name: Deploy production to REG.RU

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reg-ru-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_HOST: 37.140.192.207
      DEPLOY_USER: u3633961
      DEPLOY_PATH: /var/www/u3633961/data/www/xn--80abmkm6an.xn--p1ai
      BACKUP_ROOT: /var/www/u3633961/data/backups
      APP_PATH: /var/www/u3633961/data/tribeka-app
      BACKUPS_TO_KEEP: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check code
        run: npm run lint

      - name: Run automated tests
        run: npm test

      - name: Check PHP syntax
        run: |
          php -l public/api/request.php
          php -l server/config.example.php
          php -l server/prune-backups.php
          php -l server/purge-expired-leads.php

      - name: Build
        run: npm run build

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REG_RU_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '37.140.192.207 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKSPBaPHv9z7U4pE2aIwKFawMMTCEUWJee23Jiry4h7h' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload private maintenance scripts
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p '${APP_PATH}'"
          rsync -az --delete server/ "${DEPLOY_USER}@${DEPLOY_HOST}:${APP_PATH}/"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "/opt/php/8.3/bin/php -l '${APP_PATH}/config.example.php'"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "/opt/php/8.3/bin/php -l '${APP_PATH}/prune-backups.php'"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "/opt/php/8.3/bin/php -l '${APP_PATH}/purge-expired-leads.php'"

      - name: Back up current production
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          BACKUP_PATH="${BACKUP_ROOT}/tribeka-before-${SHORT_SHA}-${GITHUB_RUN_ID}"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p '${BACKUP_PATH}' && cp -a '${DEPLOY_PATH}/.' '${BACKUP_PATH}/'"

      - name: Keep the latest production backups
        run: ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "/opt/php/8.3/bin/php '${APP_PATH}/prune-backups.php' --keep='${BACKUPS_TO_KEEP}'"

      - name: Upload production build
        run: |
          rsync -az --delete dist/ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "/opt/php/8.3/bin/php -l '${DEPLOY_PATH}/api/request.php'"

      - name: Verify production
        run: |
          HOME_HTML="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 3 --dump-header /tmp/tribeka-home-headers https://xn--80abmkm6an.xn--p1ai/)"
          PRIVACY_HTML="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 3 https://xn--80abmkm6an.xn--p1ai/privacy/)"
          CONSENT_HTML="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 3 https://xn--80abmkm6an.xn--p1ai/consent/)"
          SITEMAP="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 3 https://xn--80abmkm6an.xn--p1ai/sitemap.xml)"
          grep --ignore-case --extended-regexp --quiet '^cache-control:.*no-cache' /tmp/tribeka-home-headers
          grep --fixed-strings --quiet '<title>ТРИБЕКА — комплексная металлообработка в Санкт-Петербурге</title>' <<< "$HOME_HTML"
          grep --fixed-strings --quiet '<title>Политика обработки персональных данных — ТРИБЕКА</title>' <<< "$PRIVACY_HTML"
          grep --fixed-strings --quiet '<title>Согласие на обработку персональных данных — ТРИБЕКА</title>' <<< "$CONSENT_HTML"
          grep --fixed-strings --quiet '<loc>https://xn--80abmkm6an.xn--p1ai/about/</loc>' <<< "$SITEMAP"
          curl --fail --silent --show-error --request OPTIONS --header 'Origin: https://xn--80abmkm6an.xn--p1ai' https://xn--80abmkm6an.xn--p1ai/api/request.php > /dev/null
