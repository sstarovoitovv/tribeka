name: Deploy production to REG.RU

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_id:
        description: 'Existing release id to restore (empty builds a new release)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: reg-ru-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_HOST: 37.140.192.207
      DEPLOY_USER: u3633961
      DEPLOY_PATH: /var/www/u3633961/data/www/xn--80abmkm6an.xn--p1ai
      APP_PATH: /var/www/u3633961/data/tribeka-app
      PHP_BIN: /opt/php/8.3/bin/php
      SITE_URL: https://xn--80abmkm6an.xn--p1ai

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, fileinfo, pdo_mysql, zip
          coverage: none
      - run: npm ci
      - run: npm run lint && npm test && npm run test:php && npm run test:deploy
      - name: Check every PHP file
        run: rg --files public/api server tests/php -g '*.php' -0 | xargs -0 -n1 php -l
      - run: npm run build
      - run: npm run test:ssg
      - name: Verify real Apache HTTP behavior
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y apache2
          node scripts/test-apache.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - name: Configure pinned SSH connection
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REG_RU_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '37.140.192.207 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKSPBaPHv9z7U4pE2aIwKFawMMTCEUWJee23Jiry4h7h' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify one-time atomic layout before upload
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "test -L '${APP_PATH}/current' && test -L '${DEPLOY_PATH}'" || {
            echo 'Initialize the atomic layout using docs/deployment.md. Live directories are never overwritten.' >&2
            exit 1
          }

      - name: Upload complete isolated release
        if: inputs.rollback_id == ''
        run: |
          RELEASE_ID="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export RELEASE_ID
          node -e 'require("fs").writeFileSync("dist/release.json", JSON.stringify({release:process.env.RELEASE_ID}) + "\n")'
          STAGE_PATH="${APP_PATH}/releases/.incoming-${RELEASE_ID}"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "test ! -e '${STAGE_PATH}' && test ! -e '${APP_PATH}/releases/${RELEASE_ID}' && mkdir -p '${STAGE_PATH}/public' '${STAGE_PATH}/server'"
          rsync -az --chmod=D755,F644 dist/ "${DEPLOY_USER}@${DEPLOY_HOST}:${STAGE_PATH}/public/"
          rsync -az --chmod=D700,F600 server/ "${DEPLOY_USER}@${DEPLOY_HOST}:${STAGE_PATH}/server/"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "mv '${STAGE_PATH}' '${APP_PATH}/releases/${RELEASE_ID}'"
          printf 'RELEASE_ID=%s\n' "$RELEASE_ID" >> "$GITHUB_ENV"

      - name: Consistent backup, atomic activation and automatic rollback on health failure
        if: inputs.rollback_id == ''
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "'${PHP_BIN}' '${APP_PATH}/releases/${RELEASE_ID}/server/deploy-release.php' --app-path='${APP_PATH}' --docroot='${DEPLOY_PATH}' --release-id='${RELEASE_ID}' --health-url='${SITE_URL}'"

      - name: Restore a previous release with the same health checks
        if: inputs.rollback_id != ''
        env:
          ROLLBACK_ID: ${{ inputs.rollback_id }}
        run: |
          [[ "$ROLLBACK_ID" =~ ^[a-zA-Z0-9][a-zA-Z0-9-]{2,79}$ ]] || exit 1
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "'${PHP_BIN}' '${APP_PATH}/current/server/deploy-release.php' --app-path='${APP_PATH}' --docroot='${DEPLOY_PATH}' --rollback-id='${ROLLBACK_ID}' --health-url='${SITE_URL}'"
